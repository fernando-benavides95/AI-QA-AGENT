name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # Fail on syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run unit tests
      env:
        # Unit tests mock all LLM calls — no real API call is made.
        # A placeholder value is required because the agent constructors
        # initialise ChatGoogleGenerativeAI at import time.
        GOOGLE_API_KEY: dummy-key-for-unit-tests
        GEMINI_MODEL_NAME: gemini-1.5-pro
      run: |
        pytest -m unit -v
