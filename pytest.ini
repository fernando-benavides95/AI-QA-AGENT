[pytest]
testpaths = test
markers =
    unit: Layer 1 — deterministic, no LLM calls — safe for CI
    llm: cross-cutting — any test that requires a real LLM API call
    evaluation: Layer 2 — LLM-as-judge quality evaluation
    consistency: Layer 3 — non-determinism and structural invariants
    adversarial: Layer 4 — adversarial inputs, prompt injection, out-of-domain
    regression: Layer 4 — prompt regression against the golden dataset
    conversational: Layer 5 — multi-turn conversation flow and tool-use evaluation
filterwarnings =
    ignore::pytest.PytestCollectionWarning
